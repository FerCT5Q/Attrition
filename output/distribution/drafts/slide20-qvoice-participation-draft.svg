<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title description">
  <title id="title">Draft: QVoice participation coverage</title>
  <desc id="description">A simple slide mockup with four 100 percent stacked horizontal bars, one per QVoice survey wave.</desc>
  <rect width="1440" height="810" fill="#f4f5f8"/>
  <g font-family="Aptos, Segoe UI, Arial, sans-serif">
    <text x="44" y="58" fill="#0f172a" font-size="31" font-weight="700">QVoice participation coverage</text>
    <text x="44" y="88" fill="#5b6478" font-size="16">Survey-row coverage by wave; “no QVoice row” is a data-coverage proxy, not confirmed non-response</text>
    <rect x="44" y="106" width="1352" height="3" rx="1.5" fill="#2457ff"/>

    <rect x="44" y="132" width="1352" height="594" rx="18" fill="#ffffff" stroke="#dfe4ee"/>
    <text x="72" y="174" fill="#0f172a" font-size="17" font-weight="700">Participation by survey wave</text>
    <text x="72" y="200" fill="#5b6478" font-size="13">Each bar is 100% of the linked workforce snapshot. The visible label highlights people with at least one answered QVoice item.</text>

    <g font-size="13" font-weight="600">
      <rect x="844" y="159" width="12" height="12" rx="3" fill="#2457ff"/><text x="864" y="170" fill="#334155">Responded</text>
      <rect x="990" y="159" width="12" height="12" rx="3" fill="#8b5cf6"/><text x="1010" y="170" fill="#334155">QVoice row / no answer</text>
      <rect x="1206" y="159" width="12" height="12" rx="3" fill="#cbd5e1"/><text x="1226" y="170" fill="#334155">No QVoice row</text>
    </g>

    <g>
      <text x="72" y="272" fill="#0f172a" font-size="17" font-weight="700">Mar 2023</text>
      <text x="72" y="295" fill="#5b6478" font-size="13">Snapshot n=42,745</text>
      <rect x="272" y="252" width="1040" height="34" rx="17" fill="#cbd5e1"/>
      <rect x="272" y="252" width="149" height="34" rx="17" fill="#2457ff"/>
      <rect x="421" y="252" width="14" height="34" fill="#8b5cf6"/>
      <text x="456" y="275" fill="#0f172a" font-size="16" font-weight="700">14.3% responded</text>
      <text x="456" y="298" fill="#5b6478" font-size="13">n=6,094</text>
    </g>

    <g>
      <text x="72" y="384" fill="#0f172a" font-size="17" font-weight="700">Jan 2024</text>
      <text x="72" y="407" fill="#5b6478" font-size="13">Snapshot n=40,145</text>
      <rect x="272" y="364" width="1040" height="34" rx="17" fill="#cbd5e1"/>
      <rect x="272" y="364" width="838" height="34" rx="17" fill="#2457ff"/>
      <rect x="1110" y="364" width="23" height="34" fill="#8b5cf6"/>
      <text x="292" y="387" fill="#ffffff" font-size="16" font-weight="700">80.6% responded  ·  n=32,369</text>
    </g>

    <g>
      <text x="72" y="496" fill="#0f172a" font-size="17" font-weight="700">Jan 2025</text>
      <text x="72" y="519" fill="#5b6478" font-size="13">Snapshot n=42,342</text>
      <rect x="272" y="476" width="1040" height="34" rx="17" fill="#cbd5e1"/>
      <rect x="272" y="476" width="857" height="34" rx="17" fill="#2457ff"/>
      <rect x="1129" y="476" width="3" height="34" fill="#8b5cf6"/>
      <text x="292" y="499" fill="#ffffff" font-size="16" font-weight="700">82.4% responded  ·  n=34,886</text>
    </g>

    <g>
      <text x="72" y="608" fill="#0f172a" font-size="17" font-weight="700">Jan 2026</text>
      <text x="72" y="631" fill="#5b6478" font-size="13">Snapshot n=47,134</text>
      <rect x="272" y="588" width="1040" height="34" rx="17" fill="#cbd5e1"/>
      <rect x="272" y="588" width="849" height="34" rx="17" fill="#2457ff"/>
      <rect x="1121" y="588" width="17" height="34" fill="#8b5cf6"/>
      <text x="292" y="611" fill="#ffffff" font-size="16" font-weight="700">81.6% responded  ·  n=38,439</text>
    </g>

    <rect x="72" y="664" width="1240" height="38" rx="8" fill="#f7f8fc"/>
    <rect x="72" y="664" width="4" height="38" rx="2" fill="#b08a00"/>
    <text x="92" y="688" fill="#475569" font-size="13"><tspan font-weight="700" fill="#334155">How to read:</tspan> a missing QVoice row can reflect eligibility or data coverage; it is not a confirmed non-response.</text>
  </g>
</svg>

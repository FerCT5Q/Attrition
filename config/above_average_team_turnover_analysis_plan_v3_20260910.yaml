schema_version: 1
plan_version: 3
plan_revision_reason: >-
  La auditoría v2 encontró seis diferencias de precisión al comparar el
  benchmark calculado con tasas de manager ya redondeadas contra su equivalente
  por exposición. Esta revisión preserva la ponderación por tamaño medio
  (exposición/18) y calcula el benchmark con su forma algebraicamente exacta:
  salidas elegibles / exposición elegible * 6. Así evita que el redondeo cambie
  una comparación en el límite 1.4.
language: es
created_before_execution: true
deliverable_mode: presentation
variable: Above-average team turnover
concept: Señal binaria de contexto de manager basada en turnover voluntario histórico relativo.
intended_use: >-
  Explorar contexto de retención asociado al equipo en análisis longitudinal de
  attrition; no evaluar managers ni tomar decisiones individuales.
outcome_boundary: Attrition voluntario posterior al cierre t; la señal nunca usa eventos posteriores a t.
knowledge_date: Cierre mensual t con 18 intervalos cerrados anteriores y 19 cierres fuente.
population: Empleados regulares activos con manager_employee_id al cierre mensual t.
grain: Empleado-snapshot mensual; cálculo intermedio manager-snapshot
semantic_type: derived_feature
source_reasoning: >-
  post_hire_monthly_worker_dtls aporta membresía y eventos primarios; cada
  manager-mes se agrega una vez. all_terminations se mantiene sólo como
  reconciliación agregada y falta lineage para declararlo fuente canónica.
definition:
  event: term_type exactamente Voluntary; Voluntary Exception, involuntarias y nulos se excluyen.
  attribution: Manager del empleado al inicio del intervalo que contiene term_date.
  eligibility: 18 intervalos consecutivos, promedio de equipo >=4 y >=2 salidas distintas.
  rate: salidas / exposición histórica * 6.
  benchmark: >-
    Promedio de tasas ponderado por tamaño medio; con 18 intervalos fijos se
    calcula exactamente como salidas elegibles / exposición elegible * 6.
  flag: 1 si tasa >=1.4*benchmark; 0 si elegible por debajo; Unknown en otro caso.
validation_story:
  - id: source-access-and-grain
    criterion: source
    evidence_role: defining
    question: ¿Existen ambas tablas y todos los campos de la ruta?
    why: Sin snapshots, relación manager y fechas no se puede derivar la señal.
    fields: [employee_id, manager_employee_id, fis_mo_end_dt, worker_type, employee_type, active_status, term_date, term_type, employeeid]
    population: Empleados regulares activos con manager al cierre mensual.
    grain: Metadata; resultado final empleado-snapshot y manager-snapshot.
    temporal_boundary: Metadata sin filas de empleados; cálculo posterior limita term_date a t.
    method: Auditoría agregada de information_schema.
    sql_reference: queries/audits/above_average_team_turnover_source_access_20260910.sql
    acceptance_rule: missing_items = 0.
    observed_evidence: Pendiente antes de ejecutar SQL.
    outcome_label: Pendiente
    interpretation: La disponibilidad técnica no demuestra lineage de terminaciones.
    score_effect: Source puede ser 2 con resultado congelado aprobado.
    limitation: La fuente primaria sigue sin lineage oficial aprobado.
    recommended_action: Conservar la auditoría y reejecutarla si cambia el esquema.
  - id: historical-window-event-attribution-and-assignment
    criterion: join
    evidence_role: defining
    question: ¿Las salidas, la historia de 18 intervalos y el join al reporte actual son únicos y time-safe?
    why: Un manager posterior, un evento duplicado o un evento futuro sesgarían la señal.
    fields: [employee_id, manager_employee_id, fis_mo_end_dt, term_date, term_type]
    population: Reportes directos actuales y exposición activa regular de los intervalos.
    grain: Manager-interval y empleado-snapshot.
    temporal_boundary: Seis cierres históricos; term_date sólo puede pertenecer a un intervalo terminado en o antes de t.
    method: Serie manager-mes, ventana de 18 filas consecutivas, deduplicación y reconciliación agregada de joins.
    sql_reference: queries/audits/above_average_team_turnover_18m_audit_20260910.sql
    acceptance_rule: Sin eventos futuros, duplicados ni coincidencias múltiples; matched_count positivo y pérdidas 0.
    observed_evidence: Pendiente antes de ejecutar SQL.
    outcome_label: Pendiente
    interpretation: La prueba sostiene Join, no determina la fuente canónica.
    score_effect: Join puede ser 2 sólo con métricas congeladas que pasen.
    limitation: La discrepancia de eventos entre fuentes sigue fuera de este join.
    recommended_action: Investigar cualquier excepción y repetir en cada refresh.
  - id: threshold-and-exact-weighted-benchmark
    criterion: definition
    evidence_role: defining
    question: ¿Se aplican 18, >=4, >=2 y >=1.4, y el benchmark ponderado reconcilia exactamente?
    why: El benchmark debe ser independiente del redondeo de tasas individuales cercanas al umbral.
    fields: [manager_employee_id, employee_id, fis_mo_end_dt, term_date, term_type]
    population: Managers actuales con equipo histórico observable.
    grain: Manager-snapshot agregado sin identidades.
    temporal_boundary: Seis cierres con 18 intervalos anteriores.
    method: >-
      Auditar límites y comparar el benchmark ponderado por tamaño medio
      (exposición/18) contra salidas/exposición*6 sin redondear tasas individuales.
    sql_reference: queries/audits/above_average_team_turnover_18m_audit_20260910.sql
    acceptance_rule: >-
      Las métricas técnicas rule_implementation_failure_count y
      benchmark_reconciliation_failure_count deben ser iguales a 0.
    observed_evidence: Pendiente antes de ejecutar SQL.
    outcome_label: Pendiente
    interpretation: La implementación puede pasar, pero Definition sigue limitada a 1 por lineage pendiente.
    score_effect: Evidencia de fórmula; no habilita Definition=2 sin reconciliación de fuente aprobada.
    limitation: El cálculo no resuelve cuál feed representa el evento gobernado.
    recommended_action: Realizar backtest out-of-time y obtener aprobación de fuente.
  - id: termination-source-reconciliation
    criterion: definition
    evidence_role: defining
    question: ¿Qué diferencias agregadas existen entre la fuente primaria y all_terminations?
    why: No se puede elevar Definition con una fuente no conciliada y sin lineage.
    fields: [employee_id, employeeid, term_date, term_type]
    population: Eventos Voluntary deduplicados de la última ventana de 18 intervalos.
    grain: Evento empleado-fecha, publicado como conteos agregados.
    temporal_boundary: Última ventana cerrada hasta el cierre más reciente.
    method: Intersección y diferencias agregadas entre llaves de evento.
    sql_reference: queries/audits/above_average_team_turnover_termination_reconciliation_20260910.sql
    acceptance_rule: La consulta debe ejecutarse y cuantificar ambos feeds y sus diferencias.
    observed_evidence: Pendiente antes de ejecutar SQL.
    outcome_label: Pendiente
    interpretation: Las diferencias limitan Definition; no se imputan ni se ocultan.
    score_effect: Definition máximo 1 hasta lineage y reconciliación aprobada.
    limitation: El agregado no designa una fuente canónica.
    recommended_action: Acordar propietario, lineage, deduplicación y fecha de conocimiento.
planned_sql:
  - queries/audits/above_average_team_turnover_source_access_20260910.sql
  - queries/audits/above_average_team_turnover_18m_audit_20260910.sql
  - queries/audits/above_average_team_turnover_termination_reconciliation_20260910.sql
  - queries/profiles/above_average_team_turnover_18m_profile_20260910.sql
publication_controls:
  - Modo presentation y agregados solamente.
  - No IDs, nombres, tasas individuales ni rankings de managers.
  - Cada bucket visible 0, 1 y Unknown debe cumplir n >=30.

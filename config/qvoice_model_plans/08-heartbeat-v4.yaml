schema_version: 1
plan_version: 4
language: es
created_before_execution: true
plan_authorship: codex_explicit
variable: Heartbeat — signos relativos de seis preguntas
concept: Signos de Q38/Q37/Q32/Q53/Q10/Q11 frente a la media personal de los 53 ítems ordinales, con al menos 38 respuestas
  1–5 válidas. La definición no se transporta a un cuestionario distinto sin equivalencia.
intended_use: Evaluación complementaria de información relativa; la frecuencia del signo no demuestra importancia predictiva.
knowledge_date: Después de publicación documentada y con definición comparable en ajuste y validación; frontera 2026-09-07.
population: Engineering activo Regular sin RF360; conservar a las personas sin Heartbeat en la evaluación general.
grain: Signo por empleado-wave y componente; publicación sólo por cohortes.
semantic_type: derived_feature
source_reasoning: La evidencia anterior es de 2026 YTD y usa una media personal. Los 52 ítems de 2025 no equivalen automáticamente
  a los 53 de 2026.
validation_story:
- id: source_heartbeat
  criterion: source
  evidence_role: supporting
  question: ¿Cuáles archivos contienen los 53 ítems ordinales que requiere la definición original?
  why: El signo relativo depende de su denominador y no sólo de seis preguntas.
  method: approved_external_access_check
  sql_reference: queries/audits/qvoice_model_heartbeat_20261006.sql
  acceptance_rule: Tres archivos accesibles y cero ambigüedades; registrar las waves que no pueden calcularse.
  metric_checks:
  - metric: workbooks_checked
    aggregate: sum
    operator: eq
    threshold: 3
  - metric: header_ambiguities
    aggregate: sum
    operator: eq
    threshold: 0
- id: heartbeat_formula
  criterion: definition
  evidence_role: defining
  question: ¿El signo calculado por productos enteros coincide con la comparación contra la media personal?
  why: Un error de coma flotante puede fabricar signos en respuestas empatadas.
  method: independent_recalculation
  sql_reference: queries/audits/qvoice_model_heartbeat_20261006.sql
  acceptance_rule: Al menos 38 respuestas de 53 y cero diferencias en respuestas comparables; no extrapolar ítems ausentes.
  metric_checks:
  - metric: comparable_count
    aggregate: sum
    operator: gt
    threshold: 0
  - metric: mismatch_count
    aggregate: sum
    operator: eq
    threshold: 0
- id: heartbeat_domain
  criterion: consistency
  evidence_role: defining
  question: ¿Las 53 entradas del promedio personal son ordinales 1–5, incluidos los ítems fuera de los seis signos publicados?
  why: Un valor inválido en cualquiera de los 53 ítems puede alterar la referencia personal, aunque ese ítem no sea uno de los seis publicados.
  method: aggregate_domain_and_transition_audit
  sql_reference: queries/audits/qvoice_model_heartbeat_20261006.sql
  acceptance_rule: Cero valores inválidos en las 53 entradas; la suma de estados debe ser igual a participantes por 53. Registrar por wave los 53 encabezados esperados y los presentes; auditar los seis signos en la validación de fórmula.
  metric_checks:
  - metric: invalid_count
    aggregate: sum
    operator: eq
    threshold: 0
  - metric: status_reconciliation_difference
    aggregate: sum
    operator: eq
    threshold: 0
- id: heartbeat_join
  criterion: join
  evidence_role: supporting
  question: ¿Los signos enlazan sin duplicados a la población de Engineering?
  why: El análisis complementario debe usar la misma población que los otros bloques.
  method: aggregate_join_reconciliation
  sql_reference: queries/audits/qvoice_model_heartbeat_20261006.sql
  acceptance_rule: Cero duplicados usados y cero múltiples matches.
  metric_checks:
  - metric: duplicate_count
    aggregate: sum
    operator: eq
    threshold: 0
  - metric: multi_match_count
    aggregate: sum
    operator: eq
    threshold: 0
- id: heartbeat_history
  criterion: history
  evidence_role: defining
  question: ¿Hay dos periodos principales con cuestionario comparable y disponibilidad acreditada?
  why: Una sola wave y muchos snapshots no constituyen replicación temporal.
  method: Revisión del conjunto de 53 ítems y fechas de publicación por wave.
  sql_reference: queries/audits/qvoice_model_heartbeat_20261006.sql
  acceptance_rule: Se requieren dos periodos completos; las waves sin equivalencia o fecha acreditada se excluyen de la comparación
    predictiva.
  metric_checks:
  - metric: unverified_availability_waves
    aggregate: sum
    operator: eq
    threshold: 0
- id: heartbeat_playbook
  criterion: definition
  evidence_role: supporting
  question: ¿Se reproducen los 18 segmentos pregunta/signo publicados para 2026 con la misma población y ventana?
  why: El playbook aporta una referencia descriptiva que debe conciliarse antes de interpretar la nueva población de Engineering.
  method: Reconciliación del recálculo actual con el JSON original de Heartbeat del 23 de septiembre.
  sql_reference: queries/audits/qvoice_model_heartbeat_20261006.sql
  acceptance_rule: Deben coincidir los conteos de fuente, enlaces, eventos y fechas; las tasas deben reproducir el redondeo del JSON histórico. La evidencia conserva la tolerancia numérica exacta. La conciliación no acredita disponibilidad temporal.
  metric_checks:
  - metric: reconciliation_tests
    aggregate: sum
    operator: gt
    threshold: 0
  - metric: reconciliation_mismatch_count
    aggregate: sum
    operator: eq
    threshold: 0
plan_revision_reason: Se conserva la auditoría de las 53 entradas de v3 y se añade la conciliación explícita de los 18 segmentos del playbook con la misma ventana y población original; no se usan para elevar scores.

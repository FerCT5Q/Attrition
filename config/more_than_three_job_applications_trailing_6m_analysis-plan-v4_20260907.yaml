variable: More than 3 job applications
plan_version: 4
plan_revision_reason: >-
  El perfil preliminar contenía positivos mensuales inferiores a la cohorte
  mínima de privacidad. Se suprimen esas celdas y se añade una distribución
  anual que sólo publica años con al menos 30 positivos.
created_before_execution: true
semantic_type: derived_feature
concept: >-
  Flag candidato de movilidad interna intensa: cuatro o más requisiciones
  internas únicas con cand_applied=1 en los seis meses calendario previos a
  cada cierre mensual.
intended_use: >-
  Evaluar, sólo de forma agregada y bajo restricción de comportamiento laboral
  sensible, si la señal tiene cobertura y definición suficientemente trazables
  para una futura feature longitudinal de attrition.
knowledge_date: Cierre de cada snapshot mensual; application_date no puede ser posterior.
population: Empleados regulares activos en cada snapshot mensual.
source_reasoning: >-
  hrda.applications mezcla filas con y sin employee_id. El vínculo al feed se
  calcula únicamente cuando una fila del empleado existía a más tardar en el
  snapshot; las celdas positivas menores de 30 se suprimen.
validation_story:
  - id: source_and_deduplication
    criterion: source
    evidence_role: defining
    question: ¿La fuente contiene eventos fechados y requisiciones utilizables para el conteo propuesto?
    why: Sin employee_id, req_id y application_date válidos no se puede derivar una feature reproducible.
    method: Auditoría agregada de disponibilidad, nulos y filas deduplicadas para cand_applied=1.
    sql_reference: queries/audits/more_than_three_job_applications_trailing_6m_source_dedup_20260907.sql
    acceptance_rule: >-
      Las columnas existen en el preflight y al menos un evento tiene
      employee_id, req_id y application_date válidos con cand_applied=1.
  - id: employee_linkage_scope
    criterion: join
    evidence_role: defining
    question: ¿Qué fracción del feed cand_applied=1 se puede vincular realmente a empleados?
    why: Las filas sin employee_id no pueden generar ni negar el flag de un empleado.
    method: Comparar agregadamente filas con employee_id, eventos completos y eventos deduplicados.
    sql_reference: queries/audits/more_than_three_job_applications_trailing_6m_employee_linkage_20260907.sql
    acceptance_rule: >-
      Sólo eventos con employee_id, req_id y application_date no nulos entran
      al cálculo; la proporción no vinculada se informa como limitación.
  - id: time_safe_linkage
    criterion: join
    evidence_role: defining
    question: ¿El denominador de vínculo al feed evita usar una fila futura respecto al snapshot?
    why: Un vínculo futuro convertiría retrospectivamente una ausencia de evento en cobertura aparente.
    method: Comparar enlaces all-time y enlaces cuyo primer registro existe al cierre del snapshot.
    sql_reference: queries/audits/more_than_three_job_applications_trailing_6m_time_safe_linkage_20260907.sql
    acceptance_rule: >-
      La distribución usa exclusivamente time_safe_linked_employee_snapshots;
      los vínculos sólo futuros se reportan como una limitación.
  - id: six_month_formula_and_boundaries
    criterion: definition
    evidence_role: defining
    question: ¿El flag de seis meses se reproduce sin diferencias y excluye eventos futuros?
    why: La definición requiere que umbral, deduplicación y fronteras temporales sean calculables al snapshot.
    method: Comparar dos implementaciones agregadas del conteo y medir inclusión real de futuro.
    sql_reference: queries/audits/more_than_three_job_applications_trailing_6m_boundary_recalculation_v2_20260907.sql
    acceptance_rule: mismatch_count=0 y future_event_rows_included=0 en todos los años fiscales evaluados.
  - id: snapshot_join_and_observability
    criterion: join
    evidence_role: defining
    question: ¿El grain empleado-snapshot es único y qué proporción de la población puede vincularse al feed?
    why: Un join duplicado infla el conteo; un no-match no prueba que no hubo solicitud.
    method: Reconciliación agregada de filas de snapshot, claves únicas y vínculo al feed.
    sql_reference: queries/audits/more_than_three_job_applications_trailing_6m_join_20260907.sql
    acceptance_rule: snapshot_duplicate_rows=0; los no-matches se conservan como observabilidad desconocida, no como ceros.
  - id: feed_freshness
    criterion: history
    evidence_role: defining
    question: ¿El feed llega hasta el periodo más reciente de snapshots para interpretar la distribución actual?
    why: Un feed detenido transforma falsamente la ausencia de eventos en un cero de la feature.
    method: Comparar agregadamente fechas mínima y máxima del feed contra la población mensual.
    sql_reference: queries/audits/more_than_three_job_applications_trailing_6m_feed_freshness_20260907.sql
    acceptance_rule: last_application_date debe ser igual o posterior al último snapshot publicable; si no, limitar la distribución al periodo observado.
  - id: six_month_distribution
    criterion: coverage
    evidence_role: supporting
    question: ¿Qué distribución anual publicable resulta del flag candidato?
    why: La distribución debe preservar la privacidad y no divulgar positivos mensuales pequeños.
    method: Agregar por año fiscal y suprimir años con menos de 30 positivos.
    sql_reference: queries/profiles/more_than_three_job_applications_trailing_6m_annual_distribution_20260907.sql
    acceptance_rule: >-
      Cada año publicado debe tener al menos 30 positivos y mostrar por
      separado elegibles, vínculos time-safe y positivos.

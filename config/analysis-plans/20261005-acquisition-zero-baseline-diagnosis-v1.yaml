scope: Diagnóstico puntual de las cinco categorías sin cohorte en la lámina 8; no es una nueva evaluación ni cambia scores.
concept: Presencia de la etiqueta acquisition y de sus empleados actuales en los snapshots históricos.
semantic_type: direct_field
intended_use: Explicar por qué Aqua, NAPS, Moonshot, Arduino y Augentix Inc. tienen base anual cero.
population: Empleados Employee / Regular activos en el snapshot aplicable; se contrasta su presencia sin esos filtros para identificar exclusiones de población.
grain: Agregados por categoría; las claves de empleado se usan exclusivamente dentro de joins y conteos.

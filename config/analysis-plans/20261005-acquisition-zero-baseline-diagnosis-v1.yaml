validation_stories:
  - question: ¿Cuándo aparece por primera vez cada etiqueta en el histórico de HRDA?
    reason: Distinguir una categoría que aparece después del corte inicial de una ausencia causada sólo por los filtros de elegibilidad.
    method: Contar empleados distintos por categoría y fecha, con y sin los filtros de la cohorte, y obtener la primera observación no vacía.
    sql_path: queries/audits/acquisition_zero_baseline_diagnosis_20261005.sql
    acceptance_rule: Cinco categorías; bases elegibles del 24 ago 2025 iguales a cero y conteos actuales iguales a los agregados originales. Una primera observación posterior demuestra ausencia de la etiqueta antes del corte, no la causa de negocio.
    score_impact: Ninguno.
  - question: ¿Los empleados hoy clasificados en esas categorías ya estaban registrados al inicio con otra etiqueta o fuera de la población elegible?
    reason: Separar incorporación posterior al histórico, reclasificación y exclusión por estado o tipo de empleado.
    method: Join interno por empleado del corte actual con todo su histórico hasta el 23 ago 2026; sólo se devuelven conteos por categoría.
    sql_path: queries/audits/acquisition_zero_baseline_diagnosis_20261005.sql
    acceptance_rule: Sin contradicciones de etiqueta por empleado en los cortes comparados; los conteos de presencia basal y ausencia basal suman el conteo actual. Cada explicación se limita al patrón observado.
    score_impact: Ninguno.

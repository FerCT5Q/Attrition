schema_version: 1
plan_version: 5
plan_revision_reason: >-
  La validacion v4 confirmo 228 de 231 historias posteriores al rehire y dejo una
  cohorte menor a 30 sin confirmacion mensual. Como max_hire_rehire_date no forma
  parte de la formula seleccionada y no representa el inicio del evento historico,
  el plan v5 conserva esa prueba como contexto, sin usarla para elevar ni reducir
  Consistency.
language: es
created_before_execution: true
variable: Manager leaving
concept: >-
  Exposicion del empleado a una terminacion ya ocurrida del manager que lo
  supervisaba en el ultimo snapshot cerrado anterior al evento.
intended_use: >-
  Medir disrupcion potencial posterior a la salida del manager mediante una ruta
  unica, agregada y segura en el tiempo.
knowledge_date: Primer cierre fiscal mensual igual o posterior a term_date.
population: Filas con worker_type='Employee', employee_type='Regular' y active_status=1.
grain: Empleado-snapshot mensual
semantic_type: derived_feature
source_reasoning: >-
  La relacion se obtiene del snapshot mensual y los eventos de all_terminations.
  is_termed, manager_effective_date, max_hire_rehire_date y la tabla _term quedan
  fuera de la formula porque las auditorias previas mostraron que no describen de
  forma consistente el evento historico requerido.
plan_authorship:
  mode: codex_explicit
  revision_reason: >-
    Se limita la evidencia definitoria a los campos realmente usados por la ruta y
    se preservan las brechas de los campos descartados como contexto auditable.
  generated_story_fallback: false
validation_story:
  - id: source_access
    criterion: source
    evidence_role: defining
    question: ¿Existen la relacion mensual y la fuente de terminaciones con todos los campos requeridos?
    why: Sin llaves y fechas no puede construirse la feature.
    fields: [employee_id, manager_employee_id, fis_mo_end_dt, employeeid, term_date, term_type]
    method: Auditoria de information_schema.
    sql_reference: queries/audits/manager_leaving_source_access_20260820.sql
    acceptance_rule: missing_items debe ser 0.
    metric_checks:
      - {metric: missing_items, aggregate: sum, operator: eq, threshold: 0}
  - id: selected_event_source_consistency
    criterion: consistency
    evidence_role: defining
    question: ¿All_terminations tiene llaves de evento unicas, fechas validas y dominios estables durante la historia utilizable?
    why: La feature necesita eventos reproducibles aunque la ventana final permanezca pendiente.
    fields: [employeeid, term_date, term_type]
    method: Auditoria longitudinal agregada de llaves, fechas y normalizacion del dominio.
    sql_reference: queries/audits/manager_leaving_all_terminations_consistency_v4_20260820.sql
    acceptance_rule: >-
      Deben existir eventos y anomaly_count, invalid_count y
      unexplained_change_count deben ser 0.
    metric_checks:
      - {metric: observations_checked, aggregate: sum, operator: gt, threshold: 0}
      - {metric: event_key_count, aggregate: sum, operator: gt, threshold: 0}
      - {metric: anomaly_count, aggregate: sum, operator: eq, threshold: 0}
      - {metric: invalid_count, aggregate: sum, operator: eq, threshold: 0}
      - {metric: unexplained_change_count, aggregate: sum, operator: eq, threshold: 0}
  - id: termination_to_prior_team_join
    criterion: join
    evidence_role: defining
    question: ¿Cada terminacion utilizable se atribuye de forma unica al equipo observado antes de la salida?
    why: El evento debe relacionarse con el manager previo y no con su reemplazante.
    fields: [manager_employee_id, employeeid, term_date, fis_mo_end_dt]
    method: Mapear el evento al primer cierre posterior, seleccionar el ultimo snapshot previo y agregar al grain final.
    sql_reference: queries/audits/manager_leaving_join_reconciliation_v2_20260820.sql
    acceptance_rule: >-
      Deben existir eventos y atribuciones; todos los conteos de unmatched,
      duplicados, multi-match, conflictos y uso futuro de la ruta definitoria deben ser 0.
    metric_checks:
      - {metric: eligible_count, aggregate: sum, operator: gt, threshold: 0}
      - {metric: matched_count, aggregate: sum, operator: gt, threshold: 0}
      - {metric: manager_event_count, aggregate: sum, operator: gt, threshold: 0}
      - {metric: attributed_employee_event_count, aggregate: sum, operator: gt, threshold: 0}
      - {metric: unmatched_count, aggregate: sum, operator: eq, threshold: 0}
      - {metric: duplicate_count, aggregate: sum, operator: eq, threshold: 0}
      - {metric: multi_match_count, aggregate: sum, operator: eq, threshold: 0}
      - {metric: raw_employee_snapshot_duplicate_rows, aggregate: sum, operator: eq, threshold: 0}
      - {metric: conflicting_manager_snapshot_count, aggregate: sum, operator: eq, threshold: 0}
      - {metric: manager_event_knowledge_unmatched_count, aggregate: sum, operator: eq, threshold: 0}
      - {metric: manager_event_knowledge_multi_match_count, aggregate: sum, operator: eq, threshold: 0}
      - {metric: attribution_unmatched_count, aggregate: sum, operator: eq, threshold: 0}
      - {metric: attribution_multi_match_count, aggregate: sum, operator: eq, threshold: 0}
      - {metric: duplicate_manager_event_rows, aggregate: sum, operator: eq, threshold: 0}
      - {metric: manager_event_term_type_conflicts, aggregate: sum, operator: eq, threshold: 0}
      - {metric: future_event_usage_count, aggregate: sum, operator: eq, threshold: 0}
  - id: discarded_monthly_event_fields
    criterion: consistency
    evidence_role: contextual
    question: ¿Por que los campos mensuales no se usan como evento canonico?
    why: La auditoria inicial encontro flags sin fecha, fechas efectivas futuras y una tabla _term sin flags positivos comparables.
    fields: [is_termed, manager_effective_date, term_date]
    method: Conservar la auditoria v1 y el perfil de _term como evidencia contextual.
    sql_reference: queries/audits/manager_leaving_consistency_reconciliation_v1_20260820.sql
    acceptance_rule: Esta prueba documenta la exclusion de esos campos y no eleva el score.
    metric_fields: [flagged_without_date_rows, future_manager_effective_date_rows, unexplained_change_count]
  - id: rehire_field_context
    criterion: consistency
    evidence_role: contextual
    question: ¿Que ocurre cuando max_hire_rehire_date es posterior a una terminacion historica?
    why: El valor mas reciente no debe reinterpretarse como inicio del evento antiguo.
    fields: [term_date, max_hire_rehire_date, is_rehire]
    method: Verificar agregadamente rehire y presencia posterior, suprimiendo detalles de cohortes pequeñas.
    sql_reference: queries/audits/manager_leaving_rehire_episode_diagnostic_v4_20260820.sql
    acceptance_rule: >-
      La prueba es contextual porque max_hire_rehire_date no participa en la formula
      final; cualquier cohorte menor a 30 se reporta como suprimida.
    metric_fields: [term_before_latest_hire_event_count, monthly_rehire_history_confirmed_count]
  - id: same_snapshot_self_join_context
    criterion: join
    evidence_role: supporting
    question: ¿Los managers sin match exacto ocurren fuera de su historia observada o dentro de huecos mensuales?
    why: Debemos explicar la limitacion aunque la ruta definitoria no requiera ese self-join.
    fields: [manager_employee_id, employee_id, fis_mo_end_dt]
    method: Clasificar cada falta respecto al primer y ultimo snapshot observado del manager.
    sql_reference: queries/audits/manager_leaving_same_snapshot_unmatched_v3_20260820.sql
    acceptance_rule: >-
      Esta evidencia es supporting; debe reconciliar todos los casos en categorias
      agregadas sin exponer IDs.
    metric_fields: [same_snapshot_manager_unmatched_count, before_manager_history_count, gap_inside_manager_history_count]
  - id: rejected_term_table_context
    criterion: consistency
    evidence_role: contextual
    question: ¿La tabla post_hire_monthly_worker_dtls_term aporta eventos utilizables para esta derivacion?
    why: Debe documentarse por que no se usa como fuente alternativa.
    fields: [is_termed, term_date]
    method: Perfil agregado de flags y fechas.
    sql_reference: queries/audits/manager_leaving_term_table_semantics_v3_20260820.sql
    acceptance_rule: La prueba es contextual y no modifica el score de la fuente seleccionada.
    metric_fields: [term_table_rows_checked, positive_flag_rows, usable_event_rows]
  - id: unresolved_exposure_window
    criterion: definition
    evidence_role: contextual
    question: ¿Esta validacion decide cuantos meses permanece expuesto el empleado?
    why: La ruta puede validarse sin convertir una ventana no aprobada en regla definitiva.
    fields: [term_date, fis_mo_end_dt]
    method: Separar la validacion tecnica de la eleccion de 3, 6 o 12 meses.
    sql_reference: queries/audits/manager_leaving_join_reconciliation_v2_20260820.sql
    acceptance_rule: Definition permanece en 1 hasta aprobar ventana y tipo de salida.
    metric_fields: [manager_event_count, manager_event_with_prior_team_count]
planned_sql:
  - queries/audits/manager_leaving_source_access_20260820.sql
  - queries/audits/manager_leaving_all_terminations_consistency_v4_20260820.sql
  - queries/audits/manager_leaving_join_reconciliation_v2_20260820.sql
  - queries/audits/manager_leaving_consistency_reconciliation_v1_20260820.sql
  - queries/audits/manager_leaving_rehire_episode_diagnostic_v4_20260820.sql
  - queries/audits/manager_leaving_same_snapshot_unmatched_v3_20260820.sql
  - queries/audits/manager_leaving_term_table_semantics_v3_20260820.sql
acceptance_rules_frozen: true

      - Validamos dominios y mappings cruzados para mostrar qué valores agrupa cada columna.
      - Validamos contradicciones y valores sin mapping porque una agrupación ambigua afecta segmentación.
      - Validamos cambios del mapping en el tiempo y unicidad empleado-snapshot.
  Layers from CEO:
    documentation_path: organizational-layers/README.md
    definition: Profundidad organizacional del snapshot desde la raíz superior de la jerarquía supervisora.
    numerator_definition: Empleados regulares activos con nivel de organización supervisora poblado.
    semantic_type: hierarchy
    attrition_use: La profundidad organizacional puede representar distancia de decisión y posición estructural.
    source_reasoning: Un campo level-from-top no demuestra distancia al CEO sin reconstruir cadenas y validar la semántica de la raíz.
    validation_focus:
      - Validamos cadenas de manager dentro del mismo snapshot porque mezclar fechas produce jerarquías imposibles.
      - Validamos raíces, convergencia, ciclos y cadenas no resueltas para medir integridad estructural.
      - Validamos profundidad reconstruida frente al campo almacenado para detectar offsets o definiciones distintas.
      - Validamos por separado que la raíz corresponda al CEO gobernado; una raíz común no basta.
  Compensation grade:
    documentation_path: compensation/README.md
    definition: Grado de compensación del empleado registrado en cada snapshot mensual.
    numerator_definition: Empleados regulares activos con `compensation_grade` poblado.
    semantic_type: direct_field
    attrition_use: El grado controla estructura de compensación, pero es información gobernada y puede codificar nivel.
    source_reasoning: Existe un grado directo; sus valores, relación con nivel y uso permitido requieren controles de privacidad.
    validation_focus:
      - Validamos gobernanza y supresión de valores porque el grado es información de compensación sensible.
      - Validamos normalización y dominio para detectar aliases o valores inválidos.
      - Validamos relación con level sin asumir que ambos campos son equivalentes.
      - Validamos cambios temporales y unicidad empleado-snapshot.
  Comp ratio:
    documentation_path: compensation/README.md
    definition: Compa-ratio precalculado en el snapshot, destinado a representar la posición del base pay frente al midpoint aplicable; numerador y denominador autoritativos siguen pendientes.
    numerator_definition: Empleados regulares activos con `compa_ratio` poblado.
    semantic_type: precomputed_metric
    attrition_use: La posición relativa frente al rango salarial mide alineación de mercado sin publicar compensación exacta.
    source_reasoning: El ratio almacenado no tiene confirmados numerador, midpoint, currency, FTE, fecha efectiva, redondeo ni lineage.
    material_questions:
      - "Parece una división; ¿qué constituye el numerador y el denominador?"
    validation_focus:
      - Validamos lineage y fórmula completa porque una distribución plausible no demuestra el cálculo.
      - Validamos componentes y reconciliación con tolerancia sobre la misma población objetivo.
      - Validamos nulos, valores no positivos y outliers para definir limpieza gobernada.
      - Validamos cambios temporales y representación final en bandas o percentiles seguros.
    numeric_bands:
      column: compa_ratio
      edges: [0.8, 0.9, 1.0, 1.1, 1.2]
  Co-location with manager:
    definition: Empleado y manager activo comparten el mismo sitio de oficina no vacío en el mismo snapshot.
    numerator_definition: Empleados con sitio poblado para sí mismos y para el manager activo matched; el evento representa igualdad de sitio.

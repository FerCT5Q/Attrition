      - Validamos historia, revisiones y frecuencia para determinar uso temporal.
      - Validamos un join aprobado por geografía u ocupación sin identity matching individual.
  LinkedIn scraping:
    definition: Señal mensual de perfil profesional externo asociada a un empleado mediante un método de recopilación aprobado.

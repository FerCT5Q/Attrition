      - Validamos el campo y significado temporal porque un perfil no es una variable por sí mismo.
      - Validamos calidad, historia y reproducibilidad de la captura.
      - Validamos identity resolution y join sólo con aprobación explícita; de otro modo la ruta queda bloqueada.
  Position / time in level:
    documentation_path: job-level/README.md
    definition: Tiempo desde la fecha efectiva de entrada al nivel, con contexto opcional de tenure en rol.
    numerator_definition: Empleados regulares activos con `levelentrydate` poblada.
    semantic_type: derived_feature
    attrition_use: El tiempo en nivel puede identificar progresión estancada o avance reciente.
    source_reasoning: Existen varias fechas; debe elegirse la fecha autoritativa y definir resets por movimientos laterales o rehire.
    derivation_formula: Diferencia completa entre `levelentrydate` aprobada y cada snapshot.
    validation_focus:
      - Validamos si el concepto es posición, rol o nivel porque cada fecha representa un tenure distinto.
      - Validamos unidad, fechas futuras y duraciones negativas para asegurar cálculo reproducible.
      - Validamos resets por promoción, movimiento lateral y rehire.
      - Validamos fórmula al snapshot y reconciliación con `time_in_role` sólo como contexto.
  Company tenure:
    definition: Tiempo de servicio completado desde la fecha de contratación aprobada hasta cada snapshot.
    numerator_definition: Empleados regulares activos con `original_hire_date` poblada.
    semantic_type: derived_feature
    attrition_use: Company tenure es un control central del ciclo laboral para modelos de attrition.
    source_reasoning: '`original_hire_date` y `max_hire_rehire_date` representan definiciones distintas de servicio.'
    derivation_formula: Diferencia entre snapshot y la base de hire aprobada, con regla explícita para interrupciones y rehires.
    validation_focus:
      - Validamos servicio continuo frente a servicio total porque producen valores distintos después de un rehire.
      - Validamos gaps, rehires y precedencia entre fechas de contratación.
      - Validamos fechas futuras, duraciones negativas y límites del snapshot.
      - Validamos la fórmula en meses o años completados y sus reglas de redondeo.
  Time since last promotion:
    definition: Tiempo completado desde la promoción más reciente conocida al momento del snapshot.
    numerator_definition: Empleados regulares activos con flag de promoción observable; la prevalencia usa `is_promo=1`.
    semantic_type: derived_feature
    attrition_use: Un periodo largo sin promoción puede reflejar fricción de progresión.
    source_reasoning: Existen indicador y fecha de promoción; elapsed time y el tratamiento sin evento deben derivarse.
    derivation_formula: Diferencia entre snapshot y la última `promotion_date` conocida, con categoría separada para sin promoción observable.
    validation_focus:
      - Validamos coherencia entre `is_promo` y `promotion_date` porque ambos deben describir el mismo evento.
      - Validamos que se seleccione la promoción más reciente cuando existan eventos repetidos.
      - Validamos el tratamiento de personas sin promoción y de historia censurada.
      - Validamos fechas negativas, fronteras y exclusión de promociones futuras.
  Promoted vs. hired into level:
    documentation_path: job-level/README.md
    definition: Clasifica la entrada al nivel actual como promoción, contratación o desconocida usando sólo eventos conocidos al snapshot.
    numerator_definition: Empleados regulares activos con fecha de entrada a nivel, estado de promoción y fechas de hire poblados.
    semantic_type: derived_feature
    attrition_use: La vía de entrada al nivel distingue progresión interna de colocación externa.
    source_reasoning: No existe un campo directo; eventos del mismo día, rehires y movimientos laterales requieren precedencia explícita.
    derivation_formula: Comparar `levelentrydate` con promoción y hire/rehire usando tolerancia y una clase Unknown.
    validation_focus:
      - Validamos tolerancia de fechas y precedencia porque eventos del mismo día pueden tener significados distintos.
      - Validamos rehires y movimientos laterales para no clasificarlos automáticamente como promoción.
      - Validamos completitud de la historia de niveles porque eventos antiguos pueden estar censurados.
      - Validamos distribución de Unknown y reconciliación independiente antes de confirmar la feature.
  Level:
    documentation_path: job-level/README.md
    definition: Nivel de puesto o management level del empleado registrado en cada snapshot mensual.
    numerator_definition: Empleados regulares activos con al menos uno de los campos de nivel aprobados poblado.
    semantic_type: grouped_mapping
    attrition_use: Level controla etapa profesional, alcance y contexto de compensación.
    source_reasoning: '`job_level_primary_position`, `level_grouped` y `management_level` son constructos distintos y no deben tratarse como sinónimos.'
    validation_focus:

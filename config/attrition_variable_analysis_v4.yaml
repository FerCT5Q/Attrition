      - Validamos proveedor, unidades y vigencia histórica de la referencia externa.
      - Validamos normalización de sitios y self-join de manager en el mismo snapshot.
      - Validamos cobertura del mapping y tratamiento de managers o sitios faltantes.
  High risk manager:
    depends_on: [Team turnover]
    definition: Clasificación gobernada de riesgo del manager, por definir, derivada de resultados históricos del equipo.
    numerator_definition: Observabilidad técnica de manager y terminaciones; no se produce actualmente una etiqueta aprobada de riesgo.

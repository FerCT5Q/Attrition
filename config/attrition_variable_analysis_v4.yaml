    source_reasoning: El composite no existe directamente; lo definen inclusión de items, reverse coding, ponderación y tratamiento de faltantes.
    population: Empleados regulares activos en el último snapshot anterior o igual al lanzamiento de la encuesta.
    derivation_formula: Promedio de los items aprobados después de aplicar dirección, validez y mínimo de respuestas.

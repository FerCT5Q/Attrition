    population: Empleados regulares activos; mapping geográfico externo todavía no validado.
    validation_focus:
      - Validamos proveedor, propietario y definición de industria porque distintas series no son equivalentes.
      - Validamos calendario de publicación y vintage para usar sólo valores conocidos al snapshot.
      - Validamos revisiones, unidades y periodos faltantes para medir estabilidad histórica.
      - Validamos el crosswalk geográfico y cohorts mínimos antes del join con empleados.
  Draup data:
    definition: Señal de mercado laboral por definir proveniente de un feed licenciado de Draup.
    numerator_definition: No validado porque no se seleccionó campo ni población del proveedor.
    semantic_type: external_source
    attrition_use: El concepto no es evaluable hasta seleccionar un dataset, campo y uso específicos.
    source_reasoning: No se encontró feed, propietario, grain, historia ni claves de join validados.
    population: Población del proveedor no validada.

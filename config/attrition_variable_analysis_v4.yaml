    validation_focus:
      - Validamos self-join empleado-manager en la misma fecha para evitar usar el manager actual en historia pasada.
      - Validamos aliases y equivalencia de sitios porque códigos distintos pueden representar la misma ubicación.
      - Validamos casos remote, sitios faltantes y managers no matched.
      - Validamos duplicados y cardinalidad para obtener una sola clasificación por empleado-snapshot.
  Hours away from manager:
    depends_on: [Location]
    definition: Distancia aprobada en tiempo de viaje o zona horaria entre sitios efectivos de empleado y manager.
    numerator_definition: No validado hasta seleccionar una referencia de sitios y una definición de distancia aprobadas.

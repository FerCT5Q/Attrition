    validation_focus:
      - Validamos target y horizonte porque high risk no tiene significado reproducible sin ambos.
      - Validamos leakage y evaluación out-of-time antes de atribuir resultados históricos a un manager.
      - Validamos tamaño mínimo de equipo, fairness y estabilidad para evitar etiquetas individuales inestables.
      - Validamos gobernanza, propietario y uso permitido antes de cualquier desarrollo.
  High turnover under this person:
    depends_on: [Team turnover]
    definition: El equipo del manager supera un umbral aprobado de rotación durante una ventana histórica.
    numerator_definition: Empleados con manager y estado de terminación observables; la prevalencia mostrada corresponde al flag subyacente.
    semantic_type: derived_feature
    attrition_use: La rotación histórica del equipo puede representar presión local de retención.
    source_reasoning: Deben derivarse tasa móvil, membresía temporal, denominador mínimo y umbral.
    derivation_formula: Tasa de terminaciones elegibles del equipo en la ventana aprobada mayor que un umbral gobernado.
    validation_focus:
      - Validamos tipo de terminación, denominador y ventana porque definen la tasa.
      - Validamos historia de manager para atribuir cada salida al equipo correcto.
      - Validamos umbral y tamaño mínimo para evitar clasificaciones inestables de equipos pequeños.
      - Validamos que sólo se usen eventos conocidos al snapshot y una evaluación out-of-time.
  Manager leaving:
    definition: El manager asignado al empleado en el snapshot tiene una terminación conocida dentro de la ventana aprobada.
    numerator_definition: Empleados con manager y estado de terminación observables; la prevalencia mostrada corresponde al flag de terminación subyacente.
    semantic_type: derived_feature
    attrition_use: La salida conocida de un manager puede alterar la experiencia del equipo; una salida futura produciría leakage.

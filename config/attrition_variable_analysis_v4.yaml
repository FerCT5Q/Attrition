      - Validamos `term_date <= snapshot_date` para excluir conocimiento futuro.
      - Validamos cambios de manager alrededor del evento para atribuirlo al equipo correcto.
  Manager change:
    definition: El empleado tuvo un cambio de manager efectivo dentro de la ventana aprobada.

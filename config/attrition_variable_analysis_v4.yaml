    definition: Conteo de eventos fechados de cambio de manager dentro de una ventana histórica aprobada.
    numerator_definition: Empleados regulares activos con cambio de manager observable; la prevalencia mostrada usa el flag subyacente.
    semantic_type: derived_feature
    attrition_use: Cambios repetidos de manager pueden medir inestabilidad organizacional prolongada.
    source_reasoning: El conteo no existe directamente y debe derivarse de historia de eventos.
    derivation_formula: Número de eventos deduplicados de cambio de manager en la ventana previa al snapshot.
    validation_focus:
      - Validamos longitud de ventana porque determina qué significa un conteo alto.
      - Validamos deduplicación de eventos y correcciones del mismo periodo.
      - Validamos fronteras exactas y tratamiento de nulos como no evento sólo cuando el flag es observable.
      - Validamos exclusión de fechas futuras y reconciliación contra eventos mensuales.
  Talent index:
    definition: Composite existente por ciclo de talento, excluyendo toda información futura o del outcome para uso en attrition.
    numerator_definition: Empleados del ciclo con `talent_index` poblado; la cobertura es interna a la fuente.
    semantic_type: precomputed_metric
    attrition_use: Un composite gobernado podría añadir contexto de performance, pero es sensible y propenso a leakage.
    source_reasoning: Fórmula, componentes restringidos, timing de ciclos y presencia de `term_reason` impiden tratar el valor actual como time-safe.
    population: Empleados presentes en cada ciclo de talent index.
    derivation_formula: Rediseño pendiente usando sólo componentes conocidos antes del corte de predicción.
    validation_focus:
      - Validamos fórmula y componentes porque el composite almacenado no expone lineage suficiente.
      - Validamos fecha de ciclo y disponibilidad de cada componente para impedir información futura.
      - Validamos explícitamente exclusión de `term_reason` y cualquier señal del outcome.
      - Validamos join, historia, gobernanza y desempeño out-of-time del composite rediseñado.
  Major inflection points:
    depends_on: [Manager change, Transfer within past year]
    definition: Evento organizacional autoritativo, por definir, que representa una reorganización o punto de inflexión material.
    numerator_definition: Empleados con al menos un proxy observable; esto no demuestra que exista un evento organizacional autoritativo.
    semantic_type: derived_feature
    attrition_use: Un composite de cambios mayores podría representar disrupción acumulada.
    source_reasoning: No existe taxonomía, fuente, pesos, ventana ni regla de solapamiento aprobados; los movimientos individuales son sólo proxies.
    derivation_formula: Por definir a partir de una fuente organizacional autoritativa; no inferir únicamente desde picos de movimientos individuales.
    validation_focus:
      - Validamos fuente y propietario del evento porque los proxies individuales no demuestran una reorganización.
      - Validamos taxonomía, alcance, severidad y fecha efectiva.
      - Validamos ventana, pesos y deduplicación de eventos simultáneos.
      - Validamos disponibilidad al snapshot y ausencia de leakage antes de construir un composite.
  ET fields:
    documentation_path: organizational-layers/README.md
    definition: Clasificación expert-track por definir, por ejemplo engineering ET1/ET2 o non-engineering ET1.
    numerator_definition: Observabilidad técnica de campos jerárquicos ET; no se ha establecido su semántica como expert track.
    semantic_type: hierarchy
    attrition_use: Una clasificación expert-track podría segmentar carrera, pero el acrónimo y mapping objetivo son ambiguos.
    source_reasoning: Los campos `et_1_leader` a `et_11_leader` parecen jerárquicos y no confirman una clasificación ET1/ET2 de carrera.
    population: Empleados u organizaciones según una definición todavía pendiente.
    validation_focus:
      - Validamos el significado autoritativo de ET antes de interpretar columnas con el mismo prefijo.
      - Validamos si los campos representan jerarquía ejecutiva o expert track porque son conceptos incompatibles.
      - Validamos orden, raíz, completitud y contradicciones sólo si el objetivo es jerárquico.
      - Validamos mapping de niveles y grain sólo después de confirmar la fuente de expert track.

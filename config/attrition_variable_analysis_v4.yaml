      - Validamos mapping de región y cohorte mínima para evitar grupos ambiguos o identificables.
      - Validamos fórmula, referencia y fallback para regiones pequeñas o varianza cero.
      - Validamos que media y desviación usen sólo datos disponibles en la wave para impedir leakage.
  Tech industry unemployment data:
    definition: Tasa periódica de desempleo de la industria tecnológica mapeada a una geografía laboral aprobada.
    numerator_definition: No validado hasta seleccionar serie externa y crosswalk geográfico.

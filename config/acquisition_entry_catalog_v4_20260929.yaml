    analysis:
      language: es
      semantic_type: direct_field
      intended_use: >-
        Describir de forma agregada la distribución y attrition voluntaria anual
        de empleados con una adquisición registrada, como contexto para priorizar
        una revisión de calidad; no se usa para decisiones individuales ni como
        prueba causal.
      definition: >-
        Campo textual acquisition del snapshot mensual. La publicación distingue
        únicamente presencia o ausencia de registro normalizado y conserva los
        nombres almacenados sin unificar aliases no documentados.
      numerator_definition: >-
        COUNT(DISTINCT employee_id) con NULLIF(TRIM(acquisition), '') no nulo.
      source_reasoning: >-
        La tabla mensual principal expone acquisition al mismo grain que la
        población activa. new_hires.acquisition_org, all_terminations.acquisition_name
        y worker_details_ms_snapshot.acquisition_yn son fuentes relacionadas para
        contrastar cobertura e historia, no sustitutos de la definición.
      validation_focus:
        - disponibilidad, tipo y grain de acquisition y fuentes relacionadas
        - unicidad de empleado-snapshot y contradicciones de valores normalizados
        - cambios longitudinales y actualización retrospectiva
        - correspondencia agregada con altas, terminaciones y fuente histórica
        - cohorte basal, ventana Voluntary y reconciliación de distribución
        - supresión de cohortes o eventos menores de 30
      prediction_cutoff: >-
        El valor del segmento debe provenir del snapshot de clasificación: 2026-08-23
        para distribución actual y 2025-08-24 para attrition anual comparable.
      prior_evidence_policy: >-
        La exploración previa del 29 de septiembre y los decks V7/V8 son contexto;
        todas las métricas, reglas y scores se recalculan en esta ejecución.
      documentation_path: acquisition-entry/README.md

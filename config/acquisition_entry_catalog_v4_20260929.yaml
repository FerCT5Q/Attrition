      ingreso sin adquisición.
    definition: >-
      Nombre de adquisición almacenado en
      hrda.post_hire_monthly_worker_dtls.acquisition al cierre del snapshot.
      Para la visual se muestran los estados operativos «Con adquisición
      registrada» y «Sin adquisición registrada»; el segundo sólo describe la
      ausencia de un registro no vacío, no el origen de ingreso de la persona.
    source:

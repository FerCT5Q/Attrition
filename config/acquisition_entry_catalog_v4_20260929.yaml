      table: hrda.post_hire_monthly_worker_dtls
      columns: [acquisition]
      status: confirmed_accessible
    profile:
      mode: aggregate_sql
      aggregate_sql_file: ../queries/profiles/acquisition_entry_coverage_20260929.sql
    level_data: Empleado-snapshot mensual
    measurement:
      type: snapshot
      date_column: fis_mo_end_dt
      fiscal_year_column: fiscal_year
      employee_id_column: employee_id
      observable_columns: [acquisition]
      observable_mode: all
    population:
      mode: default
    numerator_definition: >-
      Empleados cuyo valor normalizado NULLIF(TRIM(acquisition), '') está
      poblado en el snapshot; no se imputa ni se reclasifica un valor vacío.
    evidence:
      definition: needs_alignment
      consistency: normalization_needed
      join: mapping_or_validation
      effort: moderate_transformation
    rationale:
      definition:
        why: >-
          No existe una definición de negocio confirmada que explique qué
          significan los vacíos, los reingresos o posibles actualizaciones
          retrospectivas del campo.
        evidence: >-
          El nombre de la columna y las fuentes relacionadas sólo sustentan una
          hipótesis; no prueban que un vacío signifique «sin adquisición».
        recommended_action: >-
          Confirmar con el propietario de datos la definición, los valores
          vacíos, los reingresos y las reglas de vigencia del campo.
      consistency:
        why: >-
          Se requiere normalizar espacios y mayúsculas, y aún falta medir los
          cambios del valor por empleado a través del tiempo y las posibles
          contradicciones con fuentes de altas y bajas.
        evidence: >-
          La validación planificada debe contar dominios normalizados, cambios
          longitudinales y correspondencia agregada con acquisition_org y
          acquisition_name.
        recommended_action: >-
          Ejecutar la auditoría longitudinal y documentar cualquier mapping o
          actualización retrospectiva antes de usar aliases o interpretar valores.
      join:
        why: >-
          La ruta temporal entre el snapshot principal y las fuentes de altas o
          terminaciones aún debe reconciliarse al grain empleado-fecha.
        evidence: >-
          La propuesta usa employee_id internamente, pero todavía no cuantifica
          matches, no-matches ni duplicados por snapshot o por salida.
        recommended_action: >-
          Ejecutar una reconciliación agregada de cohortes, eventos Voluntary y
          fuentes relacionadas antes de considerar confiable el join temporal.
      effort:
        why: >-
          La distribución simple es directa, pero la interpretación segura exige
          normalización, controles temporales y tratamiento explícito de vacíos.
        evidence: >-
          El campo existe como texto almacenado; no hay mapping de aliases ni
          lineage de negocio aprobado para convertirlo en un indicador de origen.
        recommended_action: >-
          Mantener la transformación mínima versionada y reducir el esfuerzo sólo
          después de confirmar la definición y los casos límite.
    blocker: none
    verification:
      semantic_type: direct_field
      source:
        method: schema_access_check
        evidence: >-
          La auditoría agregada de information_schema verificó los seis campos

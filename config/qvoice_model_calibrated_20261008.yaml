source_rules:
  exact_header_matching: true
  binary_header_overrides:
    '2026':
      Q1: I would recommend Qualcomm as a great place to work._favorable
      M19: I would recommend Qualcomm as a great place to work._favorable
  duplicate_header_policy: Se usa el encabezado exacto del bloque principal reproducido
    en el playbook; las columnas homonimas se comparan como control y no se mezclan.
  career_wording_2024: overall, i feel that my career goals can be met at qualcomm
  career_wording_later: i feel that my career goals can be met at qualcomm
  career_cross_wave_equivalence: exploratory_transport
  career_modeling_limit: La variante Career se evalua como sensibilidad exploratoria;
    la diferencia de redaccion de 2024 impide promoverla por si sola.
  missing_sentinel: 255
  duplicate_policy: Excluir por completo la llave duplicada; registrar coincidencias
    y contradicciones sin elegir una respuesta.
  heartbeat_minimum_valid: 38
  heartbeat_expected_scale_items: 53
  heartbeat_cross_wave_equivalence: pending
temporal_rules:
  assignment: annual_lag
  maximum_age_months: 12
  availability_inclusive: true
  expiration_exclusive: true
  replacement: La wave del ano Y se usa solo en Y+1 y la siguiente wave la reemplaza
    aunque no exista una respuesta enlazable.
  employment_episode: Exigir continuidad del episodio laboral desde el ancla de la
    encuesta hasta el snapshot.
  unknown_availability: No aplica en esta ejecucion; la fecha efectiva proviene de
    la politica anual aprobada y no se interpreta como fecha real de publicacion.
  label_cutoff: La fecha final del intervalo debe ser menor o igual al corte del ajuste
    o evaluacion.
control:
  source: output/analysis/engineering/20261003/playbook-tenure-confirmation-v1/confirmation-results.json
  source_key: specs.b
  features:
  - level_grouped
  - tenure_playbook_band
  - calendar_month
  - manager_changes_12m
  - team_exits_12m
  - direct_reports_band
  - time_since_promotion_band
  - rehire
  - level_x_tenure
  - tenure_x_manager_changes
  link: cloglog
  trend: none
  recalibration_months: 0
  penalty_cell_scale: 8
  historical_fold_starts:
  - '2024-02-01'
  - '2024-08-01'
  - '2025-02-01'
  - '2025-08-01'
  historical_fold_snapshots: 6
  reproduction_relative_tolerance: 0.01
candidates:
- id: intent
  name: Intent to Stay — Q4 y Q12
  semantic_type: survey
  components:
  - Q4
  - Q12
  variants:
  - id: intent_q4
    components:
    - Q4
    representation: binary_components
  - id: intent_q12
    components:
    - Q12
    representation: binary_components
  - id: intent_components
    components:
    - Q4
    - Q12
    representation: binary_components
  - id: intent_both
    components:
    - Q4
    - Q12
    representation: favorable_both
  hypothesis: Las dos preguntas de permanencia pueden aportar información distinta
    sobre la salida posterior.
- id: career
  name: Career goals — respuesta binaria
  semantic_type: survey
  components:
  - career
  variants:
  - id: career
    components:
    - career
    representation: binary_components
  hypothesis: La percepción de oportunidades de carrera puede aportar información
    adicional a la intención de permanencia.
- id: mean33
  name: Promedio de 33 preguntas comparables
  semantic_type: derived_feature
  components: strict_common_33
  variants:
  - id: mean33
    components: strict_common_33
    representation: favorable_bands
  - id: pca_items
    components:
    - M01
    - M02
    - M03
    - M04
    - M05
    - M06
    - M07
    - M08
    - M09
    - M10
    - M11
    - M12
    - M13
    - M14
    - M15
    - M16
    - M17
    - M18
    - M19
    - M20
    - M21
    - M22
    - M23
    - M24
    - M25
    - M26
    - M27
    - M28
    - M29
    - M30
    - M31
    - M32
    - M33
    representation: binary_components
  hypothesis: El promedio puede aportar contexto adicional; incluye Q4 y Q12 y requiere
    comprobar su solapamiento.
- id: engagement
  name: Engagement — Q1, Q2 y Q3
  semantic_type: survey
  components:
  - Q1
  - Q2
  - Q3
  variants:
  - id: engagement
    components:
    - Q1
    - Q2
    - Q3
    representation: binary_components
  hypothesis: Recomendación, realización personal y motivación pueden aportar señal
    adicional a permanencia y carrera.
- id: connection
  name: Workplace Connection — versiones histórica y completa
  semantic_type: survey
  components:
  - Q5
  - Q6
  - Q7
  primary_components:
  - Q5
  - Q7
  variants:
  - id: connection_q5_q7
    components:
    - Q5
    - Q7
    representation: binary_components
  - id: connection_q5_q6_q7
    components:
    - Q5
    - Q6
    - Q7
    representation: binary_components
  hypothesis: El subconjunto Q5/Q7 permite una comparación histórica; Q6 requiere
    historia propia.
- id: wellbeing
  name: Wellbeing — versiones histórica y completa
  semantic_type: survey
  components:
  - Q8
  - Q9
  - Q10
  - Q11
  primary_components:
  - Q8
  - Q10
  - Q11
  variants:
  - id: wellbeing_q8_q10_q11
    components:
    - Q8
    - Q10
    - Q11
    representation: binary_components
  - id: wellbeing_q8_q9_q10_q11
    components:
    - Q8
    - Q9
    - Q10
    - Q11
    representation: binary_components
  hypothesis: La energía durante y después del trabajo y el estrés pueden aportar
    información diferente; Q9 no integra la versión histórica.
- id: confidence
  name: Confidence — Q13 y Q17
  semantic_type: survey
  components:
  - Q13
  - Q17
  variants:
  - id: confidence
    components:
    - Q13
    - Q17
    representation: binary_components
  hypothesis: La confianza en el futuro y en los cambios necesarios para competir
    puede complementar las percepciones individuales de carrera.

  minimum_snapshots_per_main_period: 2
  ranking: Mejorar PR-AUC y lift del decil superior en ambos periodos principales.
  calibration: No empeorar Brier medio ni error absoluto de calibracion general y
    del quintil superior.
  incremental: Demostrar mejora frente al control que usa solo disponibilidad.
  statuses:
  - prometedora
  - sin mejora demostrada
  - evidencia temporal insuficiente

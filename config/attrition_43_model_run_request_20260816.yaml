schema_version: 1
language: es
unknown_policy: pause
problem_context:
  problem_statement: Evaluar conjuntamente 43 variables de RH para construir un modelo longitudinal que prediga attrition
    a partir de snapshots históricos.
  decision_or_use_case: Seleccionar, definir y priorizar features time-safe para un modelo de attrition, conservando la evolución
    de cada empleado a través de snapshots y comparando disponibilidad, cobertura y estabilidad entre años.
  outcome: Attrition voluntario ocurrido después del snapshot de predicción y antes del siguiente snapshot mensual.
  population: Empleados regulares activos en cada snapshot mensual de predicción.
  unit_of_analysis: Empleado-snapshot mensual.
  time_horizon: Un mes, desde el cierre de un snapshot mensual hasta el cierre del siguiente snapshot.
  knowledge_boundary: Utilizar exclusivamente información disponible al cierre de cada snapshot mensual; ninguna señal posterior
    al snapshot puede entrar a la feature.
  stakeholders: Equipo de People Analytics / Attrition
  assumptions:
  - El modelo producirá una observación por empleado y snapshot mensual.
  - El target primario será attrition voluntario en el mes siguiente.
  - La disponibilidad, cobertura, missingness y estabilidad se resumirán por fiscal_year, conservando evidencia mensual.
  - La población base será empleados regulares activos en cada snapshot.
  - Gender se utilizará únicamente para auditoría de fairness y no como predictor.
  constraints:
  - Sólo consultas read-only y resultados agregados; cohortes compartidas de al menos 30.
  - No publicar IDs, nombres, correos, atributos protegidos, compensación exacta, domicilios ni texto libre.
  - Conservar el grain mensual para modelado y generar resúmenes comparables por fiscal_year.
  - Separar claramente feature time-safe, outcome futuro y cualquier señal con riesgo de leakage.
  - Entrenar con años anteriores y validar en años posteriores; evitar particiones aleatorias como validación principal.
  success_criteria:
  - Cada una de las 43 variables aparece exactamente una vez en el portafolio y conserva el orden original en el workbook.
  - Cada variable tiene cobertura, missingness, historia y estabilidad resumidas por año, además de evidencia a nivel snapshot.
  - Toda feature derivada es reproducible al snapshot y no usa información futura.
  - La evaluación distingue disponibilidad técnica, validez semántica, privacidad, esfuerzo y utilidad potencial para el modelo.
  - La validación del modelo podrá entrenar en años anteriores y probar en años posteriores sin leakage.
  portfolio_hypotheses:
  - Las señales de movilidad interna, progresión, compensación, manager, encuesta y mercado laboral aportan información complementaria,
    pero tienen ventanas y elegibilidades distintas.
  - Las variables derivadas deben evaluarse después de sus conceptos base y heredar limitaciones cuando éstos no estén confirmados.
  - Survey y fuentes externas probablemente tendrán menor frecuencia que los snapshots mensuales y requerirán joins temporales
    explícitos.
  - Gender se reservará para auditoría de fairness y no se incluirá como predictor.
  known_relationships:
  - variables:
    - Comp ratio
    - Within team compensation range
    relationship: La posición relativa dentro del equipo depende de una definición válida de Comp ratio.
    why_relevant: Una brecha en el ratio base limita Definition de la feature derivada.
  - variables:
    - Manager change
    - Number of manager changes
    relationship: El conteo histórico depende de una definición time-safe y observable del evento Manager change.
    why_relevant: La ventana, deduplicación y fecha efectiva deben ser consistentes.
  - variables:
    - Team turnover
    - High turnover under this person
    - High risk manager
    relationship: Las señales de riesgo del manager dependen de una definición gobernada de rotación histórica del equipo.
    why_relevant: Evita etiquetas circulares, leakage y exposición injustificada de managers.
  - variables:
    - Average of all Qvoice items
    - Region
    - Standardized / normalized within region
    relationship: La normalización regional depende del composite de survey y de un mapping geográfico estable.
    why_relevant: Ambos conceptos base limitan la feature normalizada.

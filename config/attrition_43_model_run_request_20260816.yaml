decisions:
  business:outcome_definition:
    decision: Usar attrition voluntario como target primario.
    source: Confirmado por el usuario.
  business:outcome_horizon:
    decision: Etiquetar attrition voluntario ocurrido antes del siguiente snapshot mensual.
    source: Confirmado por el usuario.
  business:snapshot_and_summary:
    decision: Evaluar snapshots mensuales y resumir los resultados por fiscal_year.
    source: Confirmado por el usuario.
  business:population:
    decision: Usar empleados regulares activos en cada snapshot como población base.
    source: Confirmado por el usuario.
  business:gender:
    decision: Excluir Gender de los predictores y usarlo sólo para auditoría de fairness.
    source: Política conservadora explicada al usuario.
  semantic:ratio_rate_percent:
    status: resolved
    decision: No inferir fórmulas. Confirmar numerador, denominador, elegibilidad, unidad, fecha efectiva, tolerancia y redondeo por variable; si no se reconcilia, limitar Definition.
  semantic:index_score_average:
    status: resolved
    decision: Exigir componentes, pesos, normalización, versión y tratamiento de nulos; si no hay lineage o recálculo, limitar Definition.
  semantic:count_window_time_since:
    status: resolved
    decision: Cerrar toda ventana en el snapshot, excluir eventos futuros, deduplicar al grain aprobado y probar fronteras temporales.
  semantic:group_category_level:
    status: resolved
    decision: Identificar el campo detallado y auditar mapping, vigencia, contradicciones, cambios y valores no mapeados.
  semantic:manager_team_layers:
    status: resolved
    decision: Reconstruir relaciones dentro del mismo snapshot, validar membresía, raíces, ciclos, cadenas no resueltas y semántica de la raíz.
  semantic:flag_event:
    status: resolved
    decision: Reconciliar flag y fecha; usar observabilidad para coverage y ocurrencia únicamente para prevalencia.
  semantic:survey_external:
    status: resolved
    decision: Exigir propietario, acceso aprobado, waves, refresh y join temporal; si faltan, limitar Source, History o Join conservadoramente.

version: 4
generated_from: data/QVoice raw workbooks
generated_at: '2026-08-26'
analysis_catalog: qvoice_excel_analysis_v4_20260825.yaml

qvoice_kpi_source_binary: &qvoice_kpi_source_binary
  type: Excel raw workbooks
  detail: "data/QVoice/*.xlsx, hojas Raw Data o Raw data; mapping: data/QVoice/survey_structure.xlsx"
  status: likely_unconfirmed

qvoice_kpi_source_scale: &qvoice_kpi_source_scale
  type: Excel raw workbooks
  detail: "data/QVoice/*.xlsx, hojas Raw Data o Raw data; mapping: data/QVoice/survey_structure.xlsx"
  status: likely_unconfirmed

qvoice_kpi_rationale: &qvoice_kpi_rationale
  definition:
    why: La definicion del KPI requiere confirmar la formula, el fallback de componentes y el tratamiento de respuestas parciales.
    evidence: El diccionario identifica los componentes, pero su disponibilidad y completitud cambian entre waves.
    recommended_action: Aprobar la formula de promedio y mantener indicadores separados de headers faltantes, respuestas completas y parciales.
  consistency:
    why: El wording, el formato y el conjunto de componentes pueden cambiar entre waves.
    evidence: La auditoria conserva el estado de cada componente por wave y los valores fuera de dominio.
    recommended_action: Versionar el mapping y revisar cada cambio de componente antes de comparar waves.
  join:
    why: El Excel permite deduplicar empleado-wave, pero no demuestra por si solo el join temporal a workforce.
    evidence: La auditoria de grain confirma unicidad interna y deja pendiente la reconciliacion con el snapshot de workforce.
    recommended_action: Ejecutar una reconciliacion agregada empleado-fecha antes del uso productivo.
  effort:
    why: El KPI requiere leer varios workbooks, resolver componentes, deduplicar y agregar por wave.
    evidence: El adapter conserva solo conteos y estados agregados, sin publicar filas individuales.
    recommended_action: Mantener el mapping y sus controles como parte del pipeline gobernado.

qvoice_kpi_verification_source: &qvoice_kpi_verification_source
  method: schema_access_check
  evidence: Se inspeccionaron survey_structure.xlsx y los encabezados raw para resolver cada componente del KPI por workbook.
  result: La fuente es accesible; cualquier wave sin uno o mas componentes queda registrada como cobertura parcial.
  as_of_date: '2026-08-26'
  query_reference: queries/audits/qvoice_excel_source_inventory_20260826-2.sql
  acceptance_rule: El mapping debe reportar cada componente esperado por workbook y no ocultar los componentes no disponibles.
  outcome: pending
  metric_map:
    missing_items: {column: missing_items, aggregate: sum}

variables:
  - category: Survey data
    variable: Intent to Stay items
    notes: KPI binario Intent to Stay, promedio de Q4 y Q12 segun survey_structure.xlsx; conserva el nombre de la variable historica.
    definition: KPI Intent to Stay calculado como el promedio de las preguntas Q4 y Q12 definidas en survey_structure.xlsx. Si una wave o una respuesta no tiene ambos componentes, se calcula con los componentes validos disponibles y se marca como parcial.
    source:
      type: Excel raw workbooks
      detail: "data/QVoice/*.xlsx, hojas Raw Data o Raw data; mapping: data/QVoice/survey_structure.xlsx"
      columns: [Emp ID, Snapshot Date o Recorded Date, Response Type, Region, Q4, Q12, "*_favorable o *_FAV"]
      status: likely_unconfirmed
    profile:
      mode: aggregate_sql
      aggregate_sql_file: ../queries/profiles/qvoice-excel-v4-20260826-2_01_intent-to-stay-items_coverage.sql
    level_data: Employee-wave response aggregate
    measurement:
      type: survey
      date_column: survey_wave_date
      employee_id_column: Emp ID (uso interno; no se publica)
      observable_columns: [Q4, Q12]
      observable_mode: any
    population:
      mode: custom
      display: Respuestas QVoice con identificador interno; Response Type=EX cuando existe; una fila por empleado-wave tras deduplicacion interna.
    numerator_definition: Respuestas con al menos un componente Q4/Q12 valido en 0/1; se reportan por separado las respuestas completas y parciales.
    derivation_options:
      - id: survey_structure_kpi_average_binary
        status: testable
        fields: [survey_structure.xlsx, Q4, Q12, Emp ID, survey_wave_date]
        formula: Promedio de los componentes Q4 y Q12 validos por empleado-wave; si solo uno esta disponible, conservar el promedio de ese componente y marcar la respuesta como parcial.
        grain: Employee-wave
        temporal_window: Fecha de la wave QVoice; no usar informacion posterior.
        deduplication: Conservar una fila por identificador interno y wave antes de calcular el promedio.
        null_behavior: Ignorar componentes nulos; no crear un KPI cuando ambos componentes estan ausentes.
        edge_case_handling: Separar headers faltantes, respuestas parciales y valores fuera de 0-1.
        leakage_controls: Excluir cualquier dato posterior a la fecha de la wave.
        snapshot_join: Reconciliacion agregada posterior contra workforce; no demostrada en esta corrida.
        sensitivity: Los identificadores se usan solo en memoria; se publican conteos agregados.
        estimated_effort: moderate
        decision_reason: La formula es ejecutable con los componentes disponibles, pero el fallback parcial y la elegibilidad requieren aprobacion de negocio.
    evidence:
      definition: needs_alignment
      consistency: normalization_needed
      join: mapping_or_validation
      effort: moderate_transformation
    rationale:
      definition:
        why: La correspondencia entre el encabezado con sufijo _S y Favorable, la elegibilidad y el tratamiento de respuestas parciales no esta aprobada por el propietario de QVoice.
        evidence: El diccionario define dos componentes. El inventario encuentra solo Q4 en el longitudinal, ambos componentes en 2024-2026 y respuestas parciales dentro de las waves.
        recommended_action: Aprobar el uso de un solo componente como fallback y mantener un indicador de respuesta parcial antes de modelar.
      consistency:
        why: El dominio binario es auditable, pero el wording y el formato cambian entre waves.
        evidence: La auditoria de Excel resuelve Q4/Q12 desde survey_structure.xlsx, valida el dominio binario y registra disponibilidad de encabezados y completitud por wave.
        recommended_action: Mantener un mapping versionado por wave y monitorear dominios, wording y completitud.
      join:
        why: El archivo contiene identificador y fecha de wave, pero esta ejecucion no reconcilia el employee-wave con el snapshot mensual de workforce.
        evidence: La auditoria de grain solo confirma unicidad interna de empleado-wave y no prueba un join temporal a HRDA.
        recommended_action: Reconciliar agregadamente contra el workforce snapshot historico y documentar la fecha efectiva.
      effort:
        why: La forma parece directa, pero requiere lectura de varios workbooks, deduplicacion y mapping historico.
        evidence: El adaptador local normaliza encabezados y conserva solo agregados; no existe aun un feed gobernado equivalente.
        recommended_action: Productivizar el mapping y sus controles de refresh, deduplicacion y privacidad.
    blocker: sensitive_restricted
    verification:
      semantic_type: derived_feature
      source:
        method: schema_access_check
        evidence: Se inspeccionaron survey_structure.xlsx y los encabezados de los cinco workbooks raw para resolver Q4 y Q12.
        result: La fuente es accesible, pero el mapping completo no existe en todas las waves; el resultado se congelo como agregados sin identificadores.
        as_of_date: '2026-08-26'
        query_reference: queries/audits/qvoice_excel_source_inventory_20260826-2.sql
        acceptance_rule: El mapping completo requiere ambos componentes por wave; cualquier componente ausente deja Source como evidencia parcial.
        outcome: pending
        metric_map:
          missing_items: {column: missing_items, aggregate: sum}


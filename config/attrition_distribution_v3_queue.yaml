version: 3
deliverable: internal_analysis
objective: >-
  Documentar la distribución vigente y la asociación histórica con attrition
  voluntario a seis meses para las 43 variables candidatas, por cohortes y sin
  scores individuales.
outcome:
  population: "worker_type='Employee' AND employee_type='Regular' AND active_status=1"
  grain: employee_snapshot
  definition: "term_type='VOLUNTARY' con term_date en (snapshot_date, snapshot_date + 6 meses]"
  excluded_term_types: ["VOLUNTARY EXCEPTION", "NULL"]
  monthly_history: latest_24_complete_snapshots
  minimum_cohort: 30
visual_rules:
  category_order: inherit_v2_distribution
  metric: "six_month_rate_percent + lift_vs_same_population_baseline"
  simple_layout: "distribution_left__attrition_right__context_below"
  dense_layout: "distribution_slide__immediate_attrition_companion"
  no_estimate: "panel_no_estimable"
candidates:
  - {order: 1, name: "Applied to a job", slug: applied-to-a-job}
  - {order: 2, name: "More than 3 job applications", slug: more-than-3-job-applications}
  - {order: 3, name: "Transfer within past year", slug: transfer-within-past-year}
  - {order: 4, name: "Location", slug: location}

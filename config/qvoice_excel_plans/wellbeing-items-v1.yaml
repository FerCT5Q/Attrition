schema_version: 1
plan_version: 1
language: es
created_before_execution: true
plan_authorship: codex_explicit
variable: Wellbeing items
concept: KPI binario Wellbeing calculado como el promedio de Q8, Q9, Q10 y Q11 segun survey_structure.xlsx.
intended_use: Comparar la senal binaria historica de Wellbeing con attrition posterior.
knowledge_date: Fecha de la wave QVoice; excluir informacion posterior.
population: Respuestas QVoice con una fila por empleado-wave tras deduplicacion interna y al menos un componente Q8/Q9/Q10/Q11 valido.
grain: Employee-wave response aggregate
semantic_type: derived_feature
validation_story:
  - id: source_access
    criterion: source
    evidence_role: supporting
    question: ¿El diccionario y los workbooks resuelven Q8, Q9, Q10 y Q11 para Wellbeing?
    why: El KPI tiene cuatro preguntas y cualquier ausencia debe reflejarse en la historia.
    method: schema_access_check
    sql_reference: queries/audits/qvoice_excel_source_inventory_20260826-2.sql
    acceptance_rule: El inventario debe listar cada componente esperado y sus waves disponibles.
    metric_map:
      missing_items: {column: missing_items, aggregate: sum}
    metric_checks:
      - {metric: missing_items, operator: gte, threshold: 0, aggregate: sum}
  - id: component_definition
    criterion: definition
    evidence_role: defining
    question: ¿El promedio binario de Wellbeing distingue respuestas completas, parciales y sin componente?
    why: Promediar componentes disponibles evita perder toda la respuesta, pero no debe ocultar el cambio de definicion.
    method: independent_recalculation
    sql_reference: queries/audits/qvoice_excel_definition_audit_20260826-2.sql
    acceptance_rule: Deben observarse los tres estados de completitud y valores invalidos separados por wave.
    metric_checks:
      - {metric: eligible_count, operator: gt, threshold: 0, aggregate: sum}
      - {metric: populated_count, operator: gt, threshold: 0, aggregate: sum}
      - {metric: invalid_count, operator: eq, threshold: 0, aggregate: sum}
      - {metric: partial_component_count, operator: gte, threshold: 0, aggregate: sum}
  - id: longitudinal_consistency
    criterion: consistency
    evidence_role: defining
    question: ¿El dominio y el conjunto Q8-Q11 son consistentes entre waves?
    why: Cambios de wording o componentes pueden hacer que el KPI no sea comparable.
    method: longitudinal_aggregate_audit
    sql_reference: queries/audits/qvoice_excel_consistency_audit_20260826-2.sql
    acceptance_rule: No debe haber invalidos y los cambios de item set deben quedar documentados.
    metric_checks:
      - {metric: invalid_count, operator: eq, threshold: 0, aggregate: sum}
      - {metric: item_set_change_count, operator: gte, threshold: 0, aggregate: sum}
  - id: employee_wave_grain
    criterion: join
    evidence_role: supporting
    question: ¿Wellbeing conserva una fila agregada por empleado-wave?
    why: El grain interno es necesario antes de un join temporal a workforce.
    method: key_grain_and_temporal_reconciliation
    sql_reference: queries/audits/qvoice_excel_join_grain_audit_20260826-2.sql
    acceptance_rule: No debe haber duplicados; la reconciliacion externa queda pendiente.
    metric_checks:
      - {metric: matched_count, operator: gt, threshold: 0, aggregate: sum}
      - {metric: duplicate_count, operator: eq, threshold: 0, aggregate: sum}

schema_version: 1
plan_version: 1
language: es
created_before_execution: true
plan_authorship: codex_explicit
variable: Standardized / normalized within region
concept: Z-score poblacional del composite binario dentro de cohortes region-wave de al menos 30.
intended_use: Explorar una senal binaria relativa a la distribucion regional frente a attrition posterior.
knowledge_date: Fecha de la wave QVoice; excluir informacion posterior.
population: Respuestas QVoice con composite binario, Region y cohorte region-wave de al menos 30.
grain: Employee-wave-region derived aggregate
semantic_type: derived_feature
validation_story:
  - id: source_access
    criterion: source
    evidence_role: supporting
    question: ¿Estan disponibles los componentes binarios y Region para normalizar?
    why: La estandarizacion necesita tanto el composite como un campo regional poblado.
    method: schema_access_check
    sql_reference: queries/audits/qvoice_excel_source_inventory_20260826-2.sql
    acceptance_rule: Los componentes y Region deben ser accesibles y missing_items debe ser 0.
    metric_map:
      missing_items: {column: missing_items, aggregate: sum}
    metric_checks:
      - {metric: missing_items, operator: eq, threshold: 0, aggregate: sum}
  - id: regional_recalculation
    criterion: definition
    evidence_role: defining
    question: ¿El z-score binario se puede recalcular por Region y wave con cohortes de al menos 30?
    why: La formula, la poblacion regional, la desviacion y la supresion de small cells definen el feature derivado.
    method: independent_recalculation
    sql_reference: queries/audits/qvoice_excel_definition_audit_20260826-2.sql
    acceptance_rule: Debe haber regiones observables, no deben existir invalidos y la formula debe respetar el minimo de 30; la definicion base sigue pendiente.
    metric_checks:
      - {metric: eligible_count, operator: gt, threshold: 0, aggregate: sum}
      - {metric: populated_count, operator: gt, threshold: 0, aggregate: sum}
      - {metric: regions_checked, operator: gt, threshold: 0, aggregate: sum}
      - {metric: invalid_count, operator: eq, threshold: 0, aggregate: sum}
  - id: regional_consistency
    criterion: consistency
    evidence_role: defining
    question: ¿Las cohortes regionales y el item set se mantienen consistentes entre waves?
    why: Un z-score puede cambiar por composicion regional o por cambios de item set aunque el calculo sea correcto.
    method: longitudinal_aggregate_audit
    sql_reference: queries/audits/qvoice_excel_consistency_audit_20260826-2.sql
    acceptance_rule: No deben existir invalidos, cambios de item set o desviaciones cero sin una regla aprobada.
    metric_checks:
      - {metric: invalid_count, operator: eq, threshold: 0, aggregate: sum}
      - {metric: item_set_change_count, operator: eq, threshold: 0, aggregate: sum}
      - {metric: standard_deviation_zero_count, operator: eq, threshold: 0, aggregate: sum}
  - id: regional_employee_wave_grain
    criterion: join
    evidence_role: supporting
    question: ¿El z-score conserva un grain unico de empleado-wave-region antes del join a workforce?
    why: Region debe ser conocida en la misma wave y no duplicar respuestas.
    method: key_grain_and_temporal_reconciliation
    sql_reference: queries/audits/qvoice_excel_join_grain_audit_20260826-2.sql
    acceptance_rule: No deben quedar duplicados; los unmatched de Region deben medirse y el workforce join queda pendiente.
    metric_checks:
      - {metric: matched_count, operator: gt, threshold: 0, aggregate: sum}
      - {metric: duplicate_count, operator: eq, threshold: 0, aggregate: sum}

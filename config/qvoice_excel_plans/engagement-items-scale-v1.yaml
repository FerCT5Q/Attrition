schema_version: 1
plan_version: 1
language: es
created_before_execution: true
plan_authorship: codex_explicit
variable: Engagement items-scale
concept: KPI ordinal Engagement calculado como el promedio 1-5 de Q1, Q2 y Q3 segun survey_structure.xlsx.
intended_use: Comparar la senal ordinal historica de Engagement con attrition posterior.
knowledge_date: Fecha de la wave QVoice; excluir informacion posterior.
population: Respuestas QVoice con una fila por empleado-wave tras deduplicacion interna y al menos un componente 1-5 de Q1/Q2/Q3 valido.
grain: Employee-wave response aggregate
semantic_type: derived_feature
validation_story:
  - id: source_access
    criterion: source
    evidence_role: supporting
    question: ¿Los encabezados 1-5 resuelven Q1, Q2 y Q3 para Engagement?
    why: La forma ordinal puede tener una disponibilidad distinta a la binaria y debe quedar separada.
    method: schema_access_check
    sql_reference: queries/audits/qvoice_excel_source_inventory_20260826-2.sql
    acceptance_rule: El inventario debe reportar cada componente ordinal esperado por workbook.
    metric_map:
      missing_items: {column: missing_items, aggregate: sum}
    metric_checks:
      - {metric: missing_items, operator: gte, threshold: 0, aggregate: sum}
  - id: component_definition
    criterion: definition
    evidence_role: defining
    question: ¿El promedio 1-5 usa componentes validos y separa completas de parciales?
    why: Un solo item no representa el mismo KPI ordinal que el conjunto completo.
    method: independent_recalculation
    sql_reference: queries/audits/qvoice_excel_definition_audit_20260826-2.sql
    acceptance_rule: Deben estar separados completos, parciales, sin componente e invalidos; cualquier parcial limita la definicion.
    metric_checks:
      - {metric: eligible_count, operator: gt, threshold: 0, aggregate: sum}
      - {metric: populated_count, operator: gt, threshold: 0, aggregate: sum}
      - {metric: invalid_count, operator: eq, threshold: 0, aggregate: sum}
      - {metric: partial_component_count, operator: gte, threshold: 0, aggregate: sum}
  - id: longitudinal_consistency
    criterion: consistency
    evidence_role: defining
    question: ¿El dominio 1-5 y el item set ordinal son consistentes entre waves?
    why: La historia corta y cambios de componentes pueden alterar la interpretacion de la escala.
    method: longitudinal_aggregate_audit
    sql_reference: queries/audits/qvoice_excel_consistency_audit_20260826-2.sql
    acceptance_rule: No debe haber invalidos y todo cambio de disponibilidad debe quedar documentado.
    metric_checks:
      - {metric: invalid_count, operator: eq, threshold: 0, aggregate: sum}
      - {metric: item_set_change_count, operator: gte, threshold: 0, aggregate: sum}
  - id: employee_wave_grain
    criterion: join
    evidence_role: supporting
    question: ¿La forma ordinal conserva un grain unico de empleado-wave?
    why: La deduplicacion evita inflar cobertura antes del join temporal a workforce.
    method: key_grain_and_temporal_reconciliation
    sql_reference: queries/audits/qvoice_excel_join_grain_audit_20260826-2.sql
    acceptance_rule: No debe haber duplicados ni filas sin grain interno; el join a workforce sigue pendiente.
    metric_checks:
      - {metric: matched_count, operator: gt, threshold: 0, aggregate: sum}
      - {metric: duplicate_count, operator: eq, threshold: 0, aggregate: sum}

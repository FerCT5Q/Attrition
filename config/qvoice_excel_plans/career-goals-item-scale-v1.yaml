schema_version: 1
plan_version: 1
language: es
created_before_execution: true
plan_authorship: codex_explicit
variable: Career goals item-scale
concept: Respuesta ordinal 1-5 de career goals por empleado-wave.
intended_use: Evaluar la senal ordinal 1-5 de career goals frente a attrition posterior.
knowledge_date: Fecha de la wave QVoice; excluir informacion posterior.
population: Respuestas QVoice con una fila por empleado-wave tras deduplicacion interna.
grain: Employee-wave response aggregate
semantic_type: survey
validation_story:
  - id: source_access
    criterion: source
    evidence_role: supporting
    question: ¿La fuente Excel contiene la forma 1-5 del item de career goals?
    why: La forma ordinal solo debe perfilarse en waves con columna estructurada comprobada.
    method: schema_access_check
    sql_reference: queries/audits/qvoice_excel_source_inventory_20260826-2.sql
    acceptance_rule: La forma 1-5 debe existir y missing_items debe ser 0.
    metric_map:
      missing_items: {column: missing_items, aggregate: sum}
    metric_checks:
      - {metric: missing_items, operator: eq, threshold: 0, aggregate: sum}
  - id: scale_definition
    criterion: definition
    evidence_role: defining
    question: ¿El item de career goals tiene respuestas validas en el dominio 1-5?
    why: La escala debe separarse de missingness y de valores fuera de rango antes de modelar.
    method: authoritative_definition_and_data_audit
    sql_reference: queries/audits/qvoice_excel_definition_audit_20260826-2.sql
    acceptance_rule: Debe haber respuestas observables y ningun valor invalido fuera de 1-5.
    metric_checks:
      - {metric: eligible_count, operator: gt, threshold: 0, aggregate: sum}
      - {metric: populated_count, operator: gt, threshold: 0, aggregate: sum}
      - {metric: invalid_count, operator: eq, threshold: 0, aggregate: sum}
  - id: scale_consistency
    criterion: consistency
    evidence_role: defining
    question: ¿La escala ordinal es estable entre las waves disponibles?
    why: Solo hay dos waves con forma 1-5 y el cambio de item set limita la comparabilidad.
    method: longitudinal_aggregate_audit
    sql_reference: queries/audits/qvoice_excel_consistency_audit_20260826-2.sql
    acceptance_rule: No debe haber invalidos ni cambios de item set sin una regla aprobada.
    metric_checks:
      - {metric: invalid_count, operator: eq, threshold: 0, aggregate: sum}
      - {metric: item_set_change_count, operator: eq, threshold: 0, aggregate: sum}
  - id: scale_employee_wave_grain
    criterion: join
    evidence_role: supporting
    question: ¿El Excel conserva un grain unico de empleado-wave para career goals 1-5?
    why: La deduplicacion interna evita sobrecontar la unica historia ordinal disponible.
    method: key_grain_and_temporal_reconciliation
    sql_reference: queries/audits/qvoice_excel_join_grain_audit_20260826-2.sql
    acceptance_rule: No debe haber duplicados o unmatched internos; el workforce join queda pendiente.
    metric_checks:
      - {metric: matched_count, operator: gt, threshold: 0, aggregate: sum}
      - {metric: unmatched_count, operator: eq, threshold: 0, aggregate: sum}
      - {metric: duplicate_count, operator: eq, threshold: 0, aggregate: sum}

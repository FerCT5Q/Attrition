schema_version: 1
plan_version: 1
language: es
created_before_execution: true
plan_authorship: codex_explicit
variable: Intent to Stay items
concept: KPI binario Intent to Stay calculado como el promedio de Q4 y Q12 segun survey_structure.xlsx.
intended_use: Comparar la senal binaria historica de Intent to Stay con attrition posterior.
knowledge_date: Fecha de la wave QVoice; excluir informacion posterior.
population: Respuestas QVoice con una fila por empleado-wave tras deduplicacion interna y al menos un componente Q4/Q12 valido.
grain: Employee-wave response aggregate
semantic_type: derived_feature
validation_story:
  - id: source_access
    criterion: source
    evidence_role: supporting
    question: ¿El diccionario y los encabezados de cada workbook resuelven Q4 y Q12 para Intent to Stay?
    why: El KPI solo puede compararse si sus dos componentes estan definidos y trazados por wave.
    method: schema_access_check
    sql_reference: queries/audits/qvoice_excel_source_inventory_20260826-2.sql
    acceptance_rule: El mapping completo requiere ambos componentes por wave; si falta uno, la wave puede aportar un promedio parcial pero Source queda limitado a 1.
    metric_map:
      missing_items: {column: missing_items, aggregate: sum}
    metric_checks:
      - {metric: missing_items, operator: gte, threshold: 0, aggregate: sum}
  - id: binary_definition
    criterion: definition
    evidence_role: defining
    question: ¿El promedio binario se calcula con Q4 y Q12 validos, distinguiendo respuestas completas de parciales?
    why: Usar un solo componente puede mantener cobertura, pero cambia la definicion del KPI y debe quedar medido.
    method: authoritative_definition_and_data_audit
    sql_reference: queries/audits/qvoice_excel_definition_audit_20260826-2.sql
    acceptance_rule: Debe haber respuestas pobladas, invalid_count igual a 0 y conteos separados de complete_component_count y partial_component_count; cualquier parcial limita Definition a 1.
    metric_checks:
      - {metric: eligible_count, operator: gt, threshold: 0, aggregate: sum}
      - {metric: populated_count, operator: gt, threshold: 0, aggregate: sum}
      - {metric: invalid_count, operator: eq, threshold: 0, aggregate: sum}
      - {metric: partial_component_count, operator: gte, threshold: 0, aggregate: sum}
      - {metric: complete_component_count, operator: gt, threshold: 0, aggregate: sum}
  - id: longitudinal_consistency
    criterion: consistency
    evidence_role: defining
    question: ¿La disponibilidad de Q4/Q12 y el dominio binario se mantienen trazables entre waves?
    why: Una wave con un solo componente no debe interpretarse como el mismo KPI completo de las waves con dos componentes.
    method: longitudinal_aggregate_audit
    sql_reference: queries/audits/qvoice_excel_consistency_audit_20260826-2.sql
    acceptance_rule: No debe haber valores invalidos; cada cambio en available_component_count debe quedar explicado por el mapping del diccionario.
    metric_checks:
      - {metric: invalid_count, operator: eq, threshold: 0, aggregate: sum}
      - {metric: item_set_change_count, operator: gte, threshold: 0, aggregate: sum}
  - id: employee_wave_grain
    criterion: join
    evidence_role: supporting
    question: ¿El Excel conserva un grain unico de empleado-wave para esta respuesta?
    why: La deduplicacion interna es necesaria antes de reconciliar la respuesta con un snapshot de workforce.
    method: key_grain_and_temporal_reconciliation
    sql_reference: queries/audits/qvoice_excel_join_grain_audit_20260826-2.sql
    acceptance_rule: Las filas internas deben tener match de grain y no presentar duplicados; el join a workforce queda pendiente.
    metric_checks:
      - {metric: matched_count, operator: gt, threshold: 0, aggregate: sum}
      - {metric: unmatched_count, operator: eq, threshold: 0, aggregate: sum}
      - {metric: duplicate_count, operator: eq, threshold: 0, aggregate: sum}
